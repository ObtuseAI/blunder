[package]
name = "blunder-vnext-desktop"
version = "1.2.0-alpha.1"
description = "Native Blunder vNext operator work surface"
authors = ["ObtuseAI"]
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "blunder_vnext_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.4.3"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
