[package]
name = "dumbmoney-desktop"
version = "1.2.0-alpha.1"
description = "Private-local DumbMoney operator cockpit"
authors = ["ObtuseAI"]
edition = "2024"
rust-version = "1.97.1"

[lib]
name = "dumbmoney_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
ed25519-dalek = "3.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-single-instance = "2.4.3"
time = { version = "0.3.53", features = ["parsing"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_JobObjects", "Win32_System_Threading"] }
